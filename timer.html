<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer App</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #1e1e2e; color: #cdd6f4; margin: 0; 
        }
        .app-container { 
            text-align: center; background: #313244; padding: 40px 60px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h1 { margin-top: 0; font-weight: 300; letter-spacing: 2px; color: #89b4fa; }
        #time { 
            font-size: 6rem; font-weight: bold; margin: 20px 0; 
            font-variant-numeric: tabular-nums; color: #f5c2e7;
        }
        button { 
            padding: 12px 25px; font-size: 1rem; margin: 0 10px; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; 
        }
        .btn-start { background: #a6e3a1; color: #1e1e2e; }
        .btn-start:hover { background: #94d88e; }
        .btn-reset { background: #f38ba8; color: #1e1e2e; }
        .btn-reset:hover { background: #e07b99; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>DEEP WORK TIMER</h1>
    <div id="time">25:00</div>
    <button class="btn-start" id="startBtn">Start</button>
    <button class="btn-reset" id="resetBtn">Reset</button>
</div>

<script>
    let timeLeft = 25 * 60; // 25 minutes in seconds
    let timerId = null;
    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            // Start the timer
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    startBtn.textContent = 'Start';
                    alert('Session complete! Time to take a break.');
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            // Pause the timer
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Start';
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 25 * 60;
        updateDisplay();
        startBtn.textContent = 'Start';
    });
</script>

</body>
</html>
